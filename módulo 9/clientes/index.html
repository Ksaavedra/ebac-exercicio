<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de clientes</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>
        <h1>Clientes</h1>
        <p>Cadastre um nome e um e-mail. A lista vem da API do CrudCrud.</p>

        <div class="painel">
            <section class="cartao">
                <h2>Novo cliente</h2>

                <form id="cadastro" novalidate>
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite o nome" autocomplete="name" required>

                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Digite o e-mail" autocomplete="email" required>

                    <p id="mensagem" aria-live="polite"></p>
                    <button type="submit">Cadastrar cliente</button>
                </form>
            </section>

            <section class="cartao">
                <h2>Clientes cadastrados</h2>
                <ul id="lista"></ul>
            </section>
        </div>
    </main>

    <script src="scripts.js"></script>
</body>

</html>
