<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Parquímetro</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="cartao">
        <h1>Parquímetro</h1>

        <p>Informe o valor para calcular o tempo de permanência e o troco.</p>

        <h2>Tarifas</h2>

        <ul class="tarifas">
            <li>
                <strong>R$ 1,00</strong>
                <span>30 minutos</span>
            </li>
            <li>
                <strong>R$ 1,75</strong>
                <span>60 minutos</span>
            </li>
            <li>
                <strong>R$ 3,00</strong>
                <span>120 minutos</span>
            </li>
        </ul>

        <p class="limite">Tempo máximo: 120 minutos.</p>

        <label for="valor">Valor (R$):</label>

        <input type="number" id="valor" min="0" step="0.01" placeholder="Ex: 5.00">

        <button type="button" id="calcular">Calcular</button>

        <div id="resultado" aria-live="polite"></div>
    </main>

    <script type="module" src="./js/app.js"></script>
</body>

</html>
